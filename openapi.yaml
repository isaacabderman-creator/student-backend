openapi: 3.0.3
info:
   title: API Students Web2
   version: 1.0.0
   description: API for managing students
servers:
  - url: http://localhost:3000
    description: Local server
paths:
    /students:
        get:
          summary: Get all students
          responses:
              '200':
                description: A list of students
                content:
                    application/json:
                      schema:
                          type: array
                          items:
                            $ref: '#/components/schemas/Student'
        post:
          summary: Create a new student
          requestBody:
              required: true
              content:
                application/json:
                    schema:
                      $ref: '#/components/schemas/Student'
          responses:
              '201':
                description: Student created successfully
                content:
                    application/json:
                      schema:
                          $ref: '#/components/schemas/Student'
    /students/{id}:
        get:
          summary: Get a student by ID
          parameters:
              - name: id
                in: path
                required: true
                schema:
                    type: string
          responses:
              '200':
                description: A single student
                content:
                    application/json:
                      schema:
                          $ref: '#/components/schemas/Student'
              '404':
                description: Student not found
        put:
          summary: Update a student by ID
          parameters:
              - name: id
                in: path
                required: true
                schema:
                    type: string
          requestBody:
              required: true
              content:
                application/json:
                    schema:
                      $ref: '#/components/schemas/StudentWithoutId'
          responses:
              '200':
                description: Student updated successfully
                content:
                    application/json:
                      schema:
                          $ref: '#/components/schemas/Student'
              '404':
                description: Student not found
        delete:
          summary: Delete a student by ID
          parameters:
              - name: id
                in: path
                required: true
                schema:
                    type: string
          responses:
              '204':
                description: Student deleted successfully
              '404':
                description: Student not found
components:
    schemas:
        StudentWithoutId:
            type: object
            properties:
                name:
                    type: string
                email:
                    type: string
        Student:
            type: object
            allOf:
              - $ref: '#/components/schemas/StudentWithoutId'
            properties:
                id:
                    type: string